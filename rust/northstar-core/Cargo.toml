[package]
name = "northstar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
byteorder = { workspace = true }
crc32c = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
aes-gcm = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
num_cpus = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
sqlparser = "0.50"

# AWS SDK for S3 (feature-gated)
aws-sdk-s3 = { version = "1.0", optional = true }
aws-config = { version = "1.0", optional = true }
aws-credential-types = { version = "1.0", optional = true }
aws-smithy-runtime = { version = "1.0", optional = true }

# Async streaming utilities
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
rand = "0.8"

[features]
default = []
cloud-s3 = ["aws-sdk-s3", "aws-config", "aws-credential-types", "aws-smithy-runtime", "async-stream", "futures"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
