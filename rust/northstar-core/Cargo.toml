[package]
name = "northstar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
byteorder = { workspace = true }
crc32c = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
aes-gcm = { workspace = true }
hex = "0.4"
parking_lot = { workspace = true }
crossbeam = { workspace = true }
num_cpus = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
sqlparser = "0.50"
async-trait = "0.1"
tracing = "0.1"

# AWS SDK for S3 (feature-gated)
aws-sdk-s3 = { version = "1.0", optional = true }
aws-config = { version = "1.0", optional = true }
aws-credential-types = { version = "1.0", optional = true }
aws-smithy-runtime = { version = "1.0", optional = true }

# Google Cloud Storage (feature-gated)
google-cloud-storage = { version = "0.6", optional = true }
google-cloud-token = { version = "0.1", optional = true }

# Azure Storage (feature-gated)
azure_storage = { version = "0.20", optional = true }
azure_storage_blobs = { version = "0.20", optional = true }
azure_identity = { version = "0.20", optional = true }

# Async streaming utilities
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }

# LLM provider support (feature-gated)
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
rand = "0.8"

[features]
default = []
cloud-s3 = ["aws-sdk-s3", "aws-config", "aws-credential-types", "aws-smithy-runtime", "async-stream", "futures"]
cloud-gcs = ["google-cloud-storage", "google-cloud-token", "async-stream", "futures"]
cloud-azure = ["azure_storage", "azure_storage_blobs", "azure_identity", "async-stream", "futures", "base64"]

# LLM provider features
llm-openai = ["reqwest", "futures"]
llm-anthropic = ["reqwest", "futures"]
llm-local = ["reqwest", "futures"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
