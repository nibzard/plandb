[workspace]
members = [
    "northstar-core",
    "northstar-test",
    "northstar-bench",
    "northstar-cli",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/northstar-db/northstar-rust"
authors = ["NorthstarDB Contributors"]

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.7"
thiserror = "2.0"
anyhow = "1.0"
byteorder = "1.5"

# Checksum
crc32c = "0.6"
sha2 = "0.10"

# Compression
flate2 = "1.0"

# Encryption
aes-gcm = "0.10"

# Concurrency
parking_lot = "0.12"
crossbeam = "0.8"
num_cpus = "1.16"

# Testing
proptest = "1.5"
tempfile = "3.10"

# Time series
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# Identifiers
uuid = { version = "1.10", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
